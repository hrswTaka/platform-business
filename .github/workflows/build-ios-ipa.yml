name: Build iOS IPA (unsigned, for AltStore)

# 手動実行専用。GitHubの Actions タブ → このワークフロー → Run workflow で実行する。
# 生成物: 未署名の physique.ipa（AltStore がインストール時に各自の Apple ID で署名し直す）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: body-photo-app
    steps:
      - uses: actions/checkout@v4

      # React Native は Xcode 16.1 以上を要求する
      - name: Select Xcode 16
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || \
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: body-photo-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Build (unsigned)
        run: |
          WORKSPACE=$(ls ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry physique.ipa Payload
          ls -la physique.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: physique-ipa
          path: body-photo-app/physique.ipa
          retention-days: 30
